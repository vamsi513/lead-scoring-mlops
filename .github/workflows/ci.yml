# Lint, type-check, test, build the serving image and smoke test it.
#
# Every action is pinned to a commit SHA rather than a tag, so a moved tag
# cannot change what runs here. The comment after each SHA records the tag it
# corresponded to when it was pinned.
#
# NOTE: this workflow has never run on GitHub. It was written against the
# local runs recorded in the README and the steps match them command for
# command, but the first push is also its first execution.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  check:
    name: lint, types, tests, image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Spark runs in local mode but still needs a JVM. Spark 4.2 supports
      # Java 17 and 21; this project is developed and tested on 17.
      - name: Set up Java 17 for Spark
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          pip install -r requirements-dev.txt

      - name: Report the toolchain actually in use
        run: |
          python -V
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          docker --version

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      # The serving and image tests need a registered model, so the pipeline
      # runs end to end before pytest. Sizes match the README so CI and the
      # documented numbers describe the same run.
      - name: Generate the synthetic dataset
        run: python -m data.generate

      - name: Build features with Spark
        run: python -m pipelines.features

      - name: Train and register the model
        run: python train.py

      - name: Report drift between the two snapshots
        run: python -m monitoring.drift

      - name: Run the test suite
        run: pytest -v

      - name: Build the serving image
        run: docker build -t lead-scoring-serving:test .

      - name: Start the container and call /health and /predict
        run: ./scripts/smoke_container.sh

      - name: Show container logs if the smoke test failed
        if: failure()
        run: docker logs lead-scoring-smoke || true
